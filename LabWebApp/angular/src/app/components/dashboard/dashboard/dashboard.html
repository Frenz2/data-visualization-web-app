<div class="dashboard-container">
  <h2 style="color: #2c3e50">Dashboard: Text → Graphs</h2>

  <!-- Input per testo -->
  <div class="input-section">
    <textarea 
      [(ngModel)]="inputText"
      rows="8"
      placeholder="Inserisci testo da analizzare per generare grafici..."
    ></textarea>
    <button class="custom-button" (click)="analyzeText()" [disabled]="loading || !inputText.trim()">Analizza</button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Analisi in corso...
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <!-- Pie chart -->
  <div *ngIf="dashboardData?.chartData?.length">
    <h3>Distribuzione Percentuale</h3>
    <apx-chart
      [series]="pieChartOptions.series"
      [chart]="pieChartOptions.chart"
      [labels]="pieChartOptions.labels"
      [responsive]="pieChartOptions.responsive"
      [title]="pieChartOptions.title"
    ></apx-chart>
  </div>

  <!-- Bar chart trend -->
  <div *ngIf="dashboardData?.trend?.length">
    <h3>Andamento nel Tempo (Bar Chart)</h3>
    <apx-chart
      [series]="trendChartOptions.series"
      [chart]="trendChartOptions.chart"
      [xaxis]="trendChartOptions.xaxis"
      [yaxis]="trendChartOptions.yaxis"
      [stroke]="trendChartOptions.stroke"
      [dataLabels]="trendChartOptions.dataLabels"
      [title]="trendChartOptions.title"
      [colors]="['#008FFB', '#00E396', '#FEB019', '#FF4560', '#775DD0']"
    ></apx-chart>

    <h3>Andamento nel Tempo (Line Chart)</h3>
    <apx-chart
      [series]="lineChartOptions.series"
      [chart]="lineChartOptions.chart"
      [xaxis]="lineChartOptions.xaxis"
      [yaxis]="lineChartOptions.yaxis"
      [stroke]="lineChartOptions.stroke"
      [dataLabels]="lineChartOptions.dataLabels"
      [title]="lineChartOptions.title"
      [colors]="['#008FFB', '#00E396', '#FEB019', '#FF4560', '#775DD0']"
    ></apx-chart>
  </div>
</div>
