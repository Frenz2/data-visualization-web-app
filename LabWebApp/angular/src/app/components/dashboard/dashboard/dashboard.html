<div class="dashboard-container">
  <h2>Dashboard: Text → Graphs</h2>

  <!-- Input per testo -->
  <div class="input-section">
    <textarea
      [(ngModel)]="inputText"
      rows="4"
      placeholder="Inserisci testo da analizzare per generare grafici..."
    ></textarea>
    <button (click)="analyzeText()" [disabled]="loading || !inputText.trim()">Analizza</button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    Analisi in corso...
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <!-- Pie chart -->
  <div *ngIf="dashboardData?.chartData?.length">
    <h3>Distribuzione Percentuale</h3>
    <apx-chart
      [series]="pieChartOptions.series"
      [chart]="pieChartOptions.chart"
      [labels]="pieChartOptions.labels"
      [responsive]="pieChartOptions.responsive"
      [title]="pieChartOptions.title"
    ></apx-chart>
  </div>

  <!-- Bar chart trend -->
  <div *ngIf="dashboardData?.trend?.length">
    <h3>Andamento nel Tempo</h3>
    <apx-chart
      [series]="trendChartOptions.series"
      [chart]="trendChartOptions.chart"
      [xaxis]="trendChartOptions.xaxis"
      [yaxis]="trendChartOptions.yaxis"
      [stroke]="trendChartOptions.stroke"
      [dataLabels]="trendChartOptions.dataLabels"
      [title]="trendChartOptions.title"
    ></apx-chart>
  </div>
</div>
