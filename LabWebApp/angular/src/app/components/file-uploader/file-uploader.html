<div class="upload-container" 
     [class.drag-over]="isDragOver"
     (drop)="onDrop($event)"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)">
    <div class="upload-content">
        <p>📂 Trascina qui il file oppure</p>
        <label for="fileInput" class="upload-button">Seleziona file</label>
        <input type="file" id="fileInput" (change)="onFileSelected($event)" hidden>
    </div>
    <div class="uploaded-file" *ngIf="fileSelected">
        <p>✅ File caricato:</p>
        <p><strong>Nome:</strong> {{ fileSelected.name }}</p>
        <p><strong>Dimensione:</strong> {{ (fileSelected.size / 1024).toFixed(2) }} KB</p>
    </div>
</div>
