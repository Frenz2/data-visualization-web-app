<div class="process-container">
    <div class="process-card" *ngFor="let p of processes" (click)="selectProcess(p.name)"
        [class.selected]="p.name === selectedProcess">
        <div class="icon">{{ p.icon }}</div>
        <div class="info">
            <h3>{{ p.name }}</h3>
            <p>{{ p.description }}</p>
        </div>
    </div>
</div>
